<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="appleBody" x1="8" y1="10" x2="25" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="45%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="17" y1="6" x2="22" y2="9" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>

  <!-- Stem -->
  <path d="M15.9 12 C15.5 9.6 15.9 7.6 17.6 5.8" stroke="#78350f" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Leaf with center vein -->
  <path d="M17.3 7.1 C19.3 5.2 23 5.6 23 8 C20.7 9.1 18.1 8.7 17.3 7.1 Z" fill="url(#leafGrad)"/>
  <path d="M17.6 7.3 C19.1 6.9 20.8 6.9 22.2 7.7" stroke="#15803d" stroke-width="0.4" fill="none" opacity="0.7"/>

  <!-- Apple body: deep twin-lobe top notch + gently lobed bottom -->
  <path d="M16 12.6
    C14.5 10.4 12.2 9.5 10 10.2
    C6.9 11.2 5.3 14.5 5.7 17.9
    C6.2 22.4 9 26.8 12.6 28.4
    C14 29 15 29.2 16 29.2
    C17 29.2 18 29 19.4 28.4
    C23 26.8 25.8 22.4 26.3 17.9
    C26.7 14.5 25.1 11.2 22 10.2
    C19.8 9.5 17.5 10.4 16 12.6 Z"
    fill="url(#appleBody)"/>

  <!-- Center crease suggesting natural apple ridge -->
  <path d="M16 13 C15.3 17 15.3 23 16.6 28.6" stroke="#7f1d1d" stroke-width="0.6" fill="none" opacity="0.35"/>

  <!-- Glossy highlight -->
  <ellipse cx="11.3" cy="15.5" rx="2.1" ry="3.4" fill="#fecaca" opacity="0.55" transform="rotate(-18 11.3 15.5)"/>
</svg>
